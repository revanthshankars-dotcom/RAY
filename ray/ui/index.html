<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>RAY - Real-time Autonomous Yourself</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050b16'/%3E%3Cpath d='M9 23V9h8a5 5 0 0 1 0 10h-3l6 4' stroke='%233ddcf5' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">R</div>
        <div class="brand-text">
          <strong>RAY</strong>
          <span>Control. Organize. Achieve.</span>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="Main navigation"></nav>

      <div class="sidebar-footer">
        <div class="status-line"><i class="dot" id="dot-engine"></i><span id="label-engine">Engine starting</span></div>
        <div class="status-line"><i class="dot" id="dot-ai"></i><span id="label-ai">AI: checking</span></div>
        <div class="status-line"><i class="dot" id="dot-index"></i><span id="label-index">Index: idle</span></div>
        <button class="orb-button" id="btn-voice-orb" title="Open the voice assistant" aria-label="Voice assistant">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z"/>
            <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>
          </svg>
        </button>
        <div class="orb-caption">Voice assistant</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 id="view-title" hidden>Home</h1>
        <div class="mode-strip" role="group" aria-label="RAY modes">
          <button class="mode" data-act="go" data-section="assistant" title="Think — ask, reason and draft with RAY">Think</button>
          <i aria-hidden="true">·</i>
          <button class="mode" data-act="go" data-section="agents" title="Plan — inspect plans and agent runs">Plan</button>
          <i aria-hidden="true">·</i>
          <button class="mode" data-act="go" data-section="automation" title="Automate — workflows and schedules">Automate</button>
          <i aria-hidden="true">·</i>
          <button class="mode" data-act="go" data-section="tasks" title="Execute — commands, approvals and tasks">Execute</button>
        </div>
        <button class="search-trigger" id="search-trigger" title="Open the command center (Ctrl+Space)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
          </svg>
          <span id="search-label">Search anything… apps, files, web, commands</span>
          <span class="kbd">Ctrl Space</span>
        </button>
        <div class="topbar-actions">
          <div class="status-cluster">
            <span class="status-chip" id="status-net" title="Network throughput">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 19h.01"/><path d="M8 15.5a6 6 0 0 1 8 0"/><path d="M4.5 12a11 11 0 0 1 15 0"/></svg>
              <span id="status-net-label">—</span>
            </span>
            <span class="status-chip" id="status-battery" title="Battery">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="8" width="15" height="8" rx="2"/><path d="M20.5 10.5v3"/></svg>
              <span id="status-battery-label">—</span>
            </span>
          </div>
          <div class="topbar-clock">
            <span class="time" id="topbar-time">--:--</span>
            <span class="date" id="topbar-date">—</span>
          </div>
          <button class="icon-btn" id="btn-approvals" title="Pending approvals" aria-label="Pending approvals">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a6 6 0 0 0-6 6v4l-1.5 3h15L18 13V9a6 6 0 0 0-6-6Z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></svg>
            <span class="indicator hidden" id="approval-count">0</span>
          </button>
          <button class="icon-btn" id="btn-screenshot" title="Take a screenshot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2.5"/><circle cx="12" cy="12.5" r="3.2"/><path d="M8 6l1.4-2h5.2L16 6"/></svg>
          </button>
          <button class="icon-btn" id="btn-lock" title="Emergency stop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/></svg>
          </button>
          <button class="icon-btn" id="btn-settings" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.7 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.7a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.3 9v.09A1.7 1.7 0 0 0 20.86 10H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg>
          </button>
        </div>
      </header>

      <main class="view" id="view">
        <div class="view-inner" id="view-inner">
          <div class="card"><div class="empty">Starting RAY…</div></div>
        </div>
      </main>

      <nav class="dock" id="dock" aria-label="Quick navigation"></nav>
    </div>
  </div>

  <div class="overlay hidden" id="palette-overlay" role="dialog" aria-modal="true" aria-label="Command center">
    <div class="palette">
      <div class="palette-head">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" style="color:var(--cyan)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="palette-input" placeholder="Tell RAY what to do… e.g. 'open my documents folder'" autocomplete="off" spellcheck="false" />
        <span class="kbd">Esc</span>
      </div>
      <div class="palette-body" id="palette-body"></div>
    </div>
  </div>

  <div class="overlay hidden" id="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-card"></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
