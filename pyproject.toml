[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ray-personal-ai-os"
version = "0.1.0"
description = "RAY - Real-time Autonomous Yourself: a local-first personal AI operating system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "psutil>=5.9",
    "cryptography>=42",
    "pypdf>=4.0",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.6"]
automation = ["pynput>=1.7", "pyperclip>=1.8"]
media = ["mutagen>=1.47", "Pillow>=10"]
speech = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
ray = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["ray*"]

[tool.setuptools.package-data]
"ray.ui" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
